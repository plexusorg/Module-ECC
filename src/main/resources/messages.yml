nushEnabled: "<gray>The status for NUSH is now <green>enabled</green>."
nushDisabled: "<gray>The status for NUSH is now <red>disabled</red>."
nushStatus: "<gray>NUSH is <status>. Restricted players: <yellow><restricted></yellow>. Raid detection: <yellow><detection></yellow>."
timeMustBeNumber: "<red>The time must be a number!"
timeMinimum: "<red>The wait time must be at least 1 minute."
waitTimeSet: "<gray>The wait time for restricted players before they can chat is now set to <yellow><minutes></yellow> minutes."
