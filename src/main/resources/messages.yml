playersKicked: "<light_purple>[NUSH] <admin> kicked <count> quarantined players."
trustUpdateFailed: "<red>Could not save the trust change. Check the server log."
chatSafetyOff: "<red>Chat safety is not running. The server log says why."
chatSafetyUnreachable: "<red>ECC-Server is not answering (for <since>).</red> <gray>Every line is held until it answers."
chatSafetyAnswering: "<gray>ECC-Server: <green>answering</green> (for <since>)."
chatSafetyHeldCount: "<gray>Held lines: <yellow><held></yellow>, of which <yellow><unanswered></yellow> wait for any answer. Actions not yet acknowledged: <yellow><unacknowledged></yellow>."
chatSafetyAlertsOff: "<gray>You no longer see chat safety alerts."
chatSafetyAlertsOn: "<gray>You now see chat safety alerts."
chatSafetyHeldNotice: "<gray>Your message was not sent. It is being checked."
