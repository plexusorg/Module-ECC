chatSafetyItemNameChecked: "<gray>Your item name was checked. Take the item again to rename it."
chatSafetyShortenNotice: "Shorten this text, then try again."
# Chat safety alerts, in the console and to staff with plex.ecc.alerts. <player> and <text> are shown as plain text
chatSafetyHeldAlert: "<dark_aqua>[ECC] <gray>Held <yellow><player></yellow>'s <channel>: <white><text>"
chatSafetyUnansweredAlert: "<dark_aqua>[ECC] <gray>Held <yellow><player></yellow>'s <channel> because ECC-Server did not answer: <white><text>"
chatSafetyReleaseAlert: "<dark_aqua>[ECC] <gray>Released <yellow><player></yellow>'s held lines: <detail>"
chatSafetyWarnAlert: "<dark_aqua>[ECC] <yellow><player></yellow> <gray>was warned by chat safety"
# A notice from ECC-Server itself, such as its judge budget running out
chatSafetyNoticeAlert: "<dark_aqua>[ECC] <gray>ECC-Server: <white><text>"
chatSafetyBanAlert: "<dark_aqua>[ECC] <yellow><player></yellow> <red>banned by chat safety</red> <gray>(<detail>)"
# The reason stored in chat safety's indefinite-ban entries; Plex's indefinite-ban screen shows it with the appeal link
chatSafetyBanReason: "Breaking the chat rules"