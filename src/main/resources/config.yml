# NUSH Configuration File

server:
  # Set the startup state. Use /nush on or /nush off to change and save it.
  # Raid detection runs continuously and can enable NUSH without changing this setting.
  enabled: false

  # How many online minutes a player stays restricted - this is also settable via /nush time
  # The minimum is 1 minute.
  wait_time: 5

chat_safety:
  # ECC-Server checks every line a player writes (chat, guild chat, private messages, mail, /me, signs, books, item
  # names, nicknames, tags) before anyone else sees it. It answers deliver or hold; a held line stays undelivered until ECC-Server
  # releases it, and its author is told once. Trusted players (below) are delivered at once. While false, chat safety
  # does nothing and the settings below are not read.
  enabled: false

  # ECC-Server's address as the game server reaches it, for example "http://172.17.0.1:8790" from a container on the
  # default Docker bridge. Must match ECC-Server's `listen`.
  ecc_server: "http://127.0.0.1:8790"

  # ECC-Server's token: the output of `sudo ecc-server token`. Required; chat safety stays off while it is empty.
  token: ""

  # LuckPerms groups whose players are trusted: their lines are delivered at once, without waiting for ECC-Server, and
  # ECC-Server keeps them as context for other players' lines only. Players granted plex.ecc.chat.bypass are trusted
  # too; being an operator does not make a player trusted. A line another player forces with /sudo is checked as
  # the line of the player who ran /sudo, by that player's trust. For example: ["owner", "admin"]
  trusted_groups: []

  # Links to allow. Add a host or a host and path prefix, such as "example.org/news".
  allowed_links: []
