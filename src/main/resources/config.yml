# NUSH Configuration File

server:
  # Set the startup state. Use /nush on or /nush off to change and save it.
  # Raid detection runs continuously and can enable NUSH without changing this setting.
  enabled: false

  # How many online minutes a player stays restricted - this is also settable via /nush time
  # The minimum is 1 minute.
  wait_time: 5

  # For manual activation and enabled startup, restrict players who joined within this many minutes.
  # Automatic activation selects spike contributors instead. Restrict new arrivals in either mode.
  recent_join_minutes: 5

feed:
  # How many seconds one staff feed interval lasts
  interval_seconds: 10

  # How many different restricted players must speak in one interval before NUSH
  # stops showing single lines and sends one digest instead
  digest_threshold: 5

log:
  # How many log entries NUSH keeps for each restricted player - see /nush log
  size: 50

chat_safety:
  # Checks player messages for sexual talk and grooming. While false, chat safety does nothing and the settings
  # below are not read.
  enabled: false

  # This server's name in the chat records, such as tf
  server: ""

  # The model host (ECC-Server) on this machine
  model_host: "http://127.0.0.1:8790"

  # How many of a player's messages can wait for a check; past this, their oldest waiting message is dropped
  queue_size: 20

  # How many days the daily chat records are kept
  record_retention_days: 180

  # The slow check: Kimi on Amazon Bedrock. Its API key goes in this module's .env file as
  # AWS_BEARER_TOKEN_BEDROCK=<key>; chat safety stays off without it. Use a region that serves the model's
  # inference profile (us.* profiles run in us-east-1, us-east-2 and us-west-2).
  bedrock:
    region: "us-east-1"
    model: "us.moonshotai.kimi-k3"

  # A ban is written at the verdict; the player is kicked this many minutes later, chosen at random, and stays
  # shadow-muted until then. An offline player is not kicked.
  kick_delay_minutes:
    min: 2
    max: 10

  # After this many minutes of "not sure yet" verdicts, not counting time while Bedrock was failing, the player's
  # shadow mute is lifted with no ban
  held_cap_minutes: 10
